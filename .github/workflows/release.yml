name: Release Code Quality Final Review

on:
    push:
        tags: ['v*']
    # Manual escape hatch: release-please tags/releases are created with the
    # default GITHUB_TOKEN, which GitHub Actions does not allow to trigger
    # other workflow runs. Run this manually (from the Actions tab, or the
    # API/CLI) with `tag` set to the affected tag (e.g. "v2.8.10") when a
    # release-please release publishes without a ZIP. workflow_dispatch is
    # only dispatchable using the trigger definition already on the default
    # branch, so — unlike the tag-push trigger — this works even though the
    # existing tag's own workflow file predates this input.
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing release tag to (re)build, e.g. v2.8.10'
                required: true
                type: string
    # Invoked by manual-release.yml once it has committed the version bump and
    # tagged it. Calling this directly is what makes the manual path produce a
    # ZIP: the tag manual-release.yml creates uses the default GITHUB_TOKEN and
    # therefore cannot trigger the tag-push trigger above.
    workflow_call:
        inputs:
            tag:
                description: 'Release tag to build, e.g. v2.9.9'
                required: true
                type: string

permissions:
    contents: write

jobs:
    build-and-release:
        # Guards against an accidental workflow_dispatch with no/blank tag
        # input (or one that isn't a "v*" tag) — without this, VERSION
        # extraction below would silently produce a non-version string and
        # fail confusingly deep in the job instead of skipping cleanly here.
        if: github.event_name == 'push' || (github.event_name != 'push' && startsWith(inputs.tag, 'v'))
        runs-on: ubuntu-latest

        steps:
            # Step 0: Validate the tag input strictly before it touches any
            # shell command or the checkout ref below. workflow_dispatch input
            # is attacker-controllable by anyone with dispatch access; passing
            # it through env: (rather than splicing ${{ inputs.tag }} directly
            # into a run: body) keeps the shell from ever re-parsing it, and
            # this allowlist regex additionally rejects anything that isn't a
            # clean semver tag before it can reach later steps at all.
            # (CWE-78 command injection / CWE-610 externally-controlled ref.)
            - name: Validate tag input
              if: github.event_name != 'push'
              env:
                  TAG_INPUT: ${{ inputs.tag }}
              run: |
                  if ! [[ "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
                    echo "::error::Invalid tag input '$TAG_INPUT' — must be a semver tag like v2.8.10."
                    exit 1
                  fi

            # Step 1: Check out the repository's code at the release tag —
            # explicit even on the push-tag trigger, and required on
            # workflow_dispatch since that event's own ref is whatever branch
            # it was run from (not the tag), and the tag is what must be built.
            # Safe to reference inputs.tag directly here: the step above has
            # already rejected anything that isn't a clean v-prefixed semver.
            # Fully qualified as refs/tags/<tag> (rather than the bare name)
            # so checkout can't ambiguously resolve to a same-named branch,
            # and fails outright if that tag doesn't actually exist.
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event_name != 'push' && format('refs/tags/{0}', inputs.tag) || github.ref }}
                  fetch-depth: 0

            # Step 2: Set up Git for local operations only
            - name: Set up Git
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  echo "🔧 Git configured for local operations (no push to protected branch)"

            # Step 3: Get the version number from the tag. TAG_INPUT flows
            # through env: rather than ${{ }} inside the script body, so the
            # shell only ever sees it as inert data, not re-parsed syntax.
            - name: Get the version from the tag
              id: get_version
              env:
                  TAG_INPUT: ${{ github.event_name != 'push' && inputs.tag || github.ref_name }}
              run: |
                  echo "TAG=$TAG_INPUT" >> $GITHUB_ENV
                  echo "VERSION=${TAG_INPUT#v}" >> $GITHUB_ENV

            # Step 4: Set the version from the tag.
            #
            # The tag is the source of truth. Every marker is rewritten from it
            # here rather than checked against committed values, so tagging main
            # directly works — you do not have to land a version bump
            # first. This is what v2.8.13 and v2.9.8 needed and did not have:
            # both were tagged by hand, both failed the old consistency check,
            # and both published with no ZIP.
            #
            # The drift this replaces came from a version of this step that
            # rewrote only *some* files, leaving package.json and the plugin
            # header disagreeing with each other on main. Deriving all of them
            # from one value makes that impossible inside the artifact: they
            # cannot disagree, because they all come from the tag. The check
            # below confirms the rewrite actually landed rather than assuming
            # sed matched.
            #
            # Only the build tree is touched — nothing is committed back, so a
            # protected main is never pushed to. Manual Release commits the
            # bump for you and is still the tidier path, because it also keeps
            # main and release-please's manifest in step.
            - name: Set version from tag
              run: |
                  set -euo pipefail
                  VERSION="${{ env.VERSION }}"

                  sed -i -E 's/("version":[[:space:]]*").*(")/\1'"$VERSION"'\2/' package.json
                  sed -i -E "s/^([[:space:]]*\*[[:space:]]*Version:[[:space:]]*).*/\1$VERSION/" sparxstar-3iatlas-dictionary.php
                  sed -i "s/define( 'SPARX_3IATLAS_VERSION', '[^']*' );/define( 'SPARX_3IATLAS_VERSION', '$VERSION' );/" sparxstar-3iatlas-dictionary.php
                  # Capture the spacing and put it back. These docblocks are
                  # column-aligned — src/includes/Sparxstar3IAtlasAutoLinker.php
                  # has "@version   0.8.9" — and collapsing that to a single
                  # space breaks the alignment, which PHPCS reports as an error
                  # and which fails this very job a few steps later.
                  find src/ -type f -name "*.php" -print0 | xargs -0 -r sed -i -E "s/(@version[[:space:]]+)[0-9.]+/\1$VERSION/g"

                  PKG=$(jq -r '.version' package.json)
                  PLUG=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?' sparxstar-3iatlas-dictionary.php)
                  CONST=$(grep -m1 -oP "define\( 'SPARX_3IATLAS_VERSION', '\K[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?" sparxstar-3iatlas-dictionary.php)
                  echo "Tag $VERSION -> package.json=$PKG plugin header=$PLUG constant=$CONST"

                  if [ "$PKG" != "$VERSION" ] || [ "$PLUG" != "$VERSION" ] || [ "$CONST" != "$VERSION" ]; then
                    echo "::error::Version rewrite did not apply to every marker. The file layout has"
                    echo "::error::probably changed and the sed patterns above need updating."
                    exit 1
                  fi
                  jq -e . package.json > /dev/null
                  php -l sparxstar-3iatlas-dictionary.php

            # Step 6: Verify plugin entrypoint exists.
            - name: Verify plugin entrypoint
              run: |
                  test -f sparxstar-3iatlas-dictionary.php || { echo "Missing sparxstar-3iatlas-dictionary.php"; exit 1; }
                  grep -q "Plugin Name:" sparxstar-3iatlas-dictionary.php || { echo "No plugin header found"; exit 1; }

            # Step 7: Set up PHP and install Composer dependencies (with dev
            # tools) for the quality gate below. Re-installed --no-dev
            # further down, right before packaging, so none of these
            # dev-only tools ship inside the release ZIP.
            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (Node 24)
              with:
                  php-version: '8.2'
                  tools: composer:v2
                  coverage: none
            - name: Install PHP dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            # Step 7a: Quality gate — this workflow is titled "Release Code
            # Quality Final Review"; it must actually run the checks that
            # name promises before a release artifact is built. Mirrors the
            # tech spec's production-readiness plan (OQ-017): PHPCS,
            # PHPStan, PHPUnit, and Composer audit must all succeed.
            # PHPCS blocks the release on errors only; warnings are advisory.
            # phpcs' exit code cannot express that: run() returns
            # errors + warnings as a single number, which runPHPCS() maps to 1,
            # or 2 when any of them are PHPCBF-fixable. A warnings-only run
            # therefore fails exactly like an error run, and
            # `--runtime-set ignore_warnings_on_exit 1` does not change it —
            # v2.9.1 was cut on that assumption and still failed here.
            #
            # So read the counts out of the JSON report and decide explicitly.
            # The full human-readable report is still printed first, so every
            # warning stays visible in the log; only errors stop the release.
            # The report goes to RUNNER_TEMP so it cannot land in the ZIP.
            - name: PHPCS
              run: |
                  set -uo pipefail
                  REPORT="${RUNNER_TEMP}/phpcs-report.json"

                  vendor/bin/phpcs -q || true
                  vendor/bin/phpcs -q --report=json > "$REPORT" || true

                  if ! jq -e . "$REPORT" >/dev/null 2>&1; then
                    echo "::error::PHPCS produced no parseable JSON report — it likely crashed. Failing."
                    exit 1
                  fi

                  ERRORS=$(jq -r '.totals.errors // 0' "$REPORT")
                  WARNINGS=$(jq -r '.totals.warnings // 0' "$REPORT")
                  echo "PHPCS: ${ERRORS} error(s), ${WARNINGS} warning(s)."

                  if [ "$ERRORS" -gt 0 ]; then
                    # Re-run showing errors only. "See the report above" means
                    # scrolling ~300 warning lines to find the one line that
                    # actually failed the build; this prints just the errors,
                    # with file and line.
                    echo "::group::PHPCS errors only"
                    vendor/bin/phpcs -q --warning-severity=0 || true
                    echo "::endgroup::"
                    jq -r '.files | to_entries[] | .key as $f | .value.messages[]
                           | select(.type == "ERROR")
                           | "::error file=\($f),line=\(.line)::\(.message) (\(.source))"' "$REPORT"
                    echo "::error::PHPCS reported ${ERRORS} error(s) — listed above."
                    exit 1
                  fi
            - name: PHPStan
              run: composer run analyze:php
            - name: PHPUnit
              run: composer run test:php
            - name: Composer audit
              run: composer audit

            # Step 8: Set up Node.js and build frontend assets.
            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: '10.33.0'

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  # NOTE: this is the Node that *builds* the shipped assets, not
                  # an action runtime — the Node 20 runtime deprecation does not
                  # apply to it, and retiring that runtime (see the pinned action
                  # versions above) deliberately left this value alone.
                  #
                  # It is nonetheless out of step with ci.yml and security.yml,
                  # which test on Node 22, so a green CI run does not prove this
                  # build works. Node 20 is also EOL. Aligning them is a one-line
                  # change, but it alters the environment that produces the
                  # release ZIP, so it belongs in its own change rather than
                  # riding along with an action-runtime bump.
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install JS dependencies
              run: pnpm install --frozen-lockfile

            - name: Jest
              run: pnpm test
            - name: pnpm audit (production dependencies)
              run: pnpm audit --prod

            - name: Build Assets
              run: pnpm run build

            # Step 8a: Re-install PHP dependencies production-only, now that
            # the quality gate above has passed. .distignore does not
            # exclude vendor/, so leaving dev tools (PHPUnit, PHPCS,
            # PHPStan, ...) installed here would ship them inside the
            # release ZIP built below.
            - name: Re-install PHP dependencies (no-dev, for packaging)
              run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader
            - name: Verify build output
              run: |
                  test -f assets/js/sparxstar-3iatlas-dictionary-app.min.js || { echo "Missing app JS"; exit 1; }
                  test -f assets/css/sparxstar-3iatlas-dictionary-app.min.css || { echo "Missing app CSS"; exit 1; }
                  test -f assets/js/sparxstar-3iatlas-dictionary-form.min.js || { echo "Missing form JS"; exit 1; }
                  test -f assets/css/sparxstar-3iatlas-dictionary-style.min.css || { echo "Missing shared CSS"; exit 1; }
                  echo "✅ All required build artifacts present"

            # Step 9: Build the distributable plugin ZIP file.
            - name: Ensure .distignore exists
              run: test -f .distignore || { echo ".distignore is missing"; exit 1; }

            - name: Verify production files are ready
              run: |
                  echo "🔍 Verifying production-ready files..."
                  test -d src/ || { echo "❌ Missing src/ directory"; exit 1; }
                  test -f sparxstar-3iatlas-dictionary.php || { echo "❌ Missing plugin main file"; exit 1; }
                  test -f assets/js/sparxstar-3iatlas-dictionary-app.min.js || { echo "❌ Missing app JS"; exit 1; }
                  test -f vendor/autoload.php || { echo "❌ Missing Composer autoloader"; exit 1; }
                  echo "✅ All production files verified"

            - name: Build plugin ZIP
              run: |
                  SLUG="sparxstar-3iatlas-dictionary"
                  VERSION=${{ env.VERSION }}
                  echo "🏗️ Building release ZIP with version $VERSION"

                  # Verify version was applied to files
                  echo "📋 Verifying version numbers in key files:"
                  grep -n "Version:" sparxstar-3iatlas-dictionary.php || { echo "❌ Plugin header version not found"; exit 1; }
                  grep -n "SPARX_3IATLAS_VERSION" sparxstar-3iatlas-dictionary.php || { echo "❌ Version constant not found"; exit 1; }
                  grep -n "\"version\"" package.json || { echo "❌ Package version not found"; exit 1; }

                  rm -rf build
                  mkdir -p build
                  rsync -a --exclude-from=.distignore ./ build/${SLUG}/
                  (cd build && zip -r "../${SLUG}-${VERSION}.zip" "${SLUG}")

                  echo "📦 Release ZIP created: ${SLUG}-${VERSION}.zip"

            # NEW STEP: Ensure vendor exists and is packaged
            - name: Ensure vendor directory is preserved for ZIP
              run: |
                  if [ ! -d "vendor" ]; then
                    echo "Vendor directory missing — Composer install did not create it."
                    exit 1
                  fi
                  echo "Vendor directory found."

            # Step 10: Generate checksums for the ZIP file.
            - name: Generate checksums
              run: |
                  ZIP_FILE="sparxstar-3iatlas-dictionary-${{ env.VERSION }}.zip"
                  sha256sum "$ZIP_FILE" > "$ZIP_FILE.sha256"
                  sha1sum   "$ZIP_FILE" > "$ZIP_FILE.sha1"

            # Step 11: Create GitHub Release. tag_name is explicit because on
            # workflow_dispatch the run's own ref is a branch, not the tag —
            # action-gh-release would otherwise infer the wrong tag to attach to.
            - name: Create GitHub Release
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 (Node 24)
              with:
                  tag_name: ${{ env.TAG }}
                  files: |
                      sparxstar-3iatlas-dictionary-${{ env.VERSION }}.zip
                      sparxstar-3iatlas-dictionary-${{ env.VERSION }}.zip.sha256
                      sparxstar-3iatlas-dictionary-${{ env.VERSION }}.zip.sha1
