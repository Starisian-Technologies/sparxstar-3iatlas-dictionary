# Sync Contracts to Public Repo
#
# Publishes this repo's shared contract surface (schemas/) into the platform
# contracts repo so downstream consumers see a single canonical copy.
#
# Adapted from the Helios template for the Dictionary:
#   - source dir  : schemas/**            (Helios used packages/sparxstar-helios-contracts/src)
#   - target path : Contracts/IAMC/Dictionary/  (Helios used Contracts/IAMC/Helios/)
#
# Requires (configure in repo settings before first run):
#   - vars.CONTRACT_SYNC_CLIENT_ID      GitHub App client id (create-github-app-token
#                                       accepts either the App ID or the client id)
#   - secrets.CONTRACT_SYNC_PRIVATE_KEY GitHub App private key
#   - the App installed on Starisian-Technologies/sparxstar-platform-contracts

name: Sync Contracts to Public Repo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'schemas/**'

permissions:
  contents: read

# Serialize runs so rapid successive pushes to main can't race and produce
# conflicting commits/pushes to the shared contracts repo. Do not cancel an
# in-progress run mid-push — let it finish, then run the next.
concurrency:
  group: sync-contracts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dictionary
        uses: actions/checkout@v4
        with:
          path: source

      - name: Generate token
        uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ vars.CONTRACT_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.CONTRACT_SYNC_PRIVATE_KEY }}
          owner: Starisian-Technologies

      - name: Checkout contracts repo
        uses: actions/checkout@v4
        with:
          repository: Starisian-Technologies/sparxstar-platform-contracts
          token: ${{ steps.token.outputs.token }}
          path: target

      - name: Copy contracts
        run: |
          set -e
          set -euo pipefail
          if [ -z "$(ls -A source/schemas 2>/dev/null)" ]; then
            echo "No contract files in schemas/ — nothing to sync."
            exit 0
          fi
          rm -rf target/Contracts/IAMC/Dictionary/
          mkdir -p target/Contracts/IAMC/Dictionary/
          # Trailing /. copies directory contents (incl. dotfiles) without
          # relying on glob expansion, which would error on an empty dir.
          cp -r source/schemas/. target/Contracts/IAMC/Dictionary/

      - name: Push if changed
        working-directory: target
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "sparxstar-contract-sync[bot]"
          git config user.email "contract-sync@starisian.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "chore: sync Dictionary contracts from 3iatlas-dictionary@${SOURCE_SHA}"
          git push origin main
