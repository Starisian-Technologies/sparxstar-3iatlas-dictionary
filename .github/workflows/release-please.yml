# Release Please — maintains a standing "Release PR" on main that bumps
# package.json / the plugin header / CHANGELOG.md from Conventional Commits.
# Merging that PR creates the vX.Y.Z tag and the GitHub Release. This workflow
# never builds or ships anything itself — it only prepares the version bump
# and changelog.
#
# The tag it creates does NOT start release.yml. Tags pushed with the default
# GITHUB_TOKEN cannot trigger other workflow runs, by GitHub's design, so the
# release lands with no plugin ZIP attached until release.yml is run by hand:
#
#     Actions -> "Release Code Quality Final Review" -> Run workflow
#         tag: vX.Y.Z
#
# release.yml documents the same escape hatch at its workflow_dispatch input.
# v2.8.13 and v2.9.0 were both published assetless for exactly this reason.

name: Release Please

# Run on request only. This used to fire on every push to main and keep a
# Release PR permanently open, which is noise when releases are cut by hand —
# and worse than noise once the two paths disagree: Manual Release cannot commit
# to main (it is protected), so this workflow's manifest falls behind the tags
# and it starts proposing versions that have already shipped. It last offered
# 2.8.14 while v2.10.7 was live.
#
# Dispatch it when you actually want a Conventional-Commit-derived version and
# a generated changelog. Otherwise use Manual Release, or tag main directly.
on:
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
