name: Auto Assign

on:
    issues:
        types: [opened]
    pull_request:
        types: [opened]

jobs:
    run:
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write

        steps:
            - name: Auto-assign issue or PR
              uses: pozil/auto-assign-issue@af6beea6bdf1e8eb373f061c5bc168681fc6d011
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  assignees: MaximillianGroup
                  numOfAssignee: 1
