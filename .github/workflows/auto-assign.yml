name: Auto Assign

on:
    issues:
        types: [opened]
    pull_request:
        types: [opened]

jobs:
    run:
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write

        steps:
            - name: Auto-assign issue or PR
              uses: pozil/auto-assign-issue@d6e511896e5f1d2408e74db74416647d8ff80c8c
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  assignees: MaximillianGroup
                  numOfAssignee: 1
