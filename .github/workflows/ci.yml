name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    build-and-test:
        name: Build & Test (PHP ${{ matrix.php-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.2', '8.3', '8.4']

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              # uses: pnpm/action-setup@v6.0.9
              with:
                  version: '10.33.0'

            - name: Setup PHP
              uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring, intl, json
                  tools: composer:v2
                  coverage: none

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Get Composer Cache Directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer Dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

            - name: Install PHP Dependencies
              run: composer install --no-interaction --prefer-dist

            - name: Install JS Dependencies
              run: pnpm install --frozen-lockfile

            # phpcs (baseline), PHPStan, eslint, and stylelint now run only via
            # the reusable Platform Standards workflows (.github/workflows/standards.yml)
            # — one source of enforcement. This file keeps what standards.yml does
            # not cover: the strict new-file gate and the test runners.

            # New PHP files must meet the full WPCS + VIPWPCS standard (no baseline
            # demotions). Legacy files are exempt and cleaned up incrementally.
            - name: Lint new PHP files (strict)
              if: github.event_name == 'pull_request' && matrix.php-version == '8.3'
              run: |
                  git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
                  NEW=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}" HEAD -- '*.php' || true)
                  if [ -z "$NEW" ]; then
                    echo "No new PHP files to lint."
                    exit 0
                  fi
                  echo "New PHP files:"; echo "$NEW"
                  echo "$NEW" | xargs vendor/bin/phpcs -q --standard=.phpcs-strict.xml.dist

            - name: Test PHP
              run: composer run test:php

            - name: Test JS
              run: pnpm test

            # Dependency audits — release gate per the tech spec (OQ-017). Both
            # require the install steps above to have already populated
            # vendor/ and node_modules/, otherwise composer audit reports
            # "No packages" instead of actually auditing anything.
            - name: Composer audit
              if: matrix.php-version == '8.3'
              run: composer audit

            - name: pnpm audit (production dependencies)
              if: matrix.php-version == '8.3'
              run: pnpm audit --prod
