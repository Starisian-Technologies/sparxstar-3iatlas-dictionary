permissions:
    contents: read
name: Security Checks
on:
    schedule:
        - cron: '0 0 * * 0'
    workflow_dispatch:
jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (Node 24)
              with:
                  php-version: '8.3'
                  tools: composer:v2
                  coverage: none

            # Dependencies must be installed first — auditing an empty
            # vendor/ silently reports "No packages" instead of failing.
            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist

            - name: Composer audit
              run: composer audit

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: '10.33.0'

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install JS dependencies
              run: pnpm install --frozen-lockfile

            - name: pnpm audit (production dependencies)
              run: pnpm audit --prod
